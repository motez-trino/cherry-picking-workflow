name: Auto Cherry-Pick Hotfix to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cherry-pick:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Cherry-pick merge commit into develop
        id: cherry_pick
        run: |
          merge_sha="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$merge_sha" ]; then
            echo "::error::Missing merge commit SHA"; exit 1
          fi
          git checkout develop || { echo "::error::Failed to checkout develop"; exit 1; }
          if ! git cherry-pick -m 1 --no-commit "$merge_sha"; then
            echo "conflict=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          if git diff --quiet --cached --exit-code && git diff --quiet --exit-code; then
            git reset --hard HEAD
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "noop=true" >> $GITHUB_OUTPUT
          else
            git commit -m "Cherry-pick PR merge $merge_sha from main"
            git restore --staged --worktree --source=HEAD .github/workflows || :
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "noop=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes to develop
        if: ${{ steps.cherry_pick.outputs.conflict == 'false' && steps.cherry_pick.outputs.noop != 'true' }}
        run: git push origin develop

      - name: Notify Slack on success
        if: ${{ success() && steps.cherry_pick.outputs.conflict == 'false' && steps.cherry_pick.outputs.noop != 'true' && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ Cherry-pick completed
            Repository: ${{ github.repository }}
            From: main → To: develop
            PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})
            Merge: https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}
            Merged By: ${{ github.event.pull_request.merged_by.login }}
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on no-op
        if: ${{ success() && steps.cherry_pick.outputs.noop == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ℹ️ Cherry-pick skipped (already applied)
            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})
            Merge: https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ Cherry-pick failed
            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}