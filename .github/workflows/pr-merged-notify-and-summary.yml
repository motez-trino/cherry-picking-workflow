name: PR Merged Notify and Daily Summary

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-merged-notify:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - name: Prepare PR body
        id: prepare_body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const trunc = body.length > 800 ? body.slice(0, 800) + '…' : body;
            const wrapped = '```\n' + trunc.replace(/```/g, '``\`') + '\n```';
            core.setOutput('body_sanitized_json', JSON.stringify(wrapped));
      - name: Notify Slack on PR merged
        if: ${{ env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":tada: PR merged successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":tada: *PR merged successfully!*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|view PR>\nNumber: #${{ github.event.pull_request.number }}\nMerged Into: `${{ github.event.pull_request.base.ref }}`\nMerged By: *${{ github.event.pull_request.merged_by.login }}*\n\n*Well done you champ, I can't believe you did this, you rock!!!*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ steps.prepare_body.outputs.body_sanitized_json }}
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
      - name: CI-only test marker
        run: echo "[CI ONLY] hotfix/ci-only-1: workflow-only change to validate exclusion on develop"

  daily-summary:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - name: Build merged PR summary for last 24h
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sinceISO = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

            const q = `repo:${owner}/${repo} is:pr is:merged merged:>=${sinceISO}`;
            const perPage = 50;
            const items = [];
            let page = 1;
            while (true) {
              const res = await github.rest.search.issuesAndPullRequests({ q, sort: 'updated', order: 'desc', per_page: perPage, page });
              const batch = res.data.items || [];
              items.push(...batch);
              if (batch.length < perPage || page >= 5) break;
              page++;
            }

            if (items.length === 0) {
              core.setOutput('summary_json', JSON.stringify('No PRs merged in the last 24 hours.'));
              return;
            }

            // Fetch base branch for each PR
            const lines = [];
            for (const it of items) {
              const num = it.number;
              const pull = await github.rest.pulls.get({ owner, repo, pull_number: num });
              const base = pull.data.base.ref;
              const title = it.title;
              const url = it.html_url;
              const mergedBy = pull.data.merged_by ? pull.data.merged_by.login : 'unknown';
              const mergedAt = pull.data.merged_at || it.closed_at || '';
              lines.push(`• #${num} ${title} → ${base} (by ${mergedBy})\n   ${url}\n   merged at ${mergedAt}`);
            }

            const header = `Merged PRs in the last 24 hours for ${owner}/${repo}`;
            const text = `${header}\n\n${lines.join('\n')}`;
            core.setOutput('summary_json', JSON.stringify(text));

      - name: Notify Slack daily merged PR summary
        if: ${{ env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ${{ steps.build.outputs.summary_json }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ steps.build.outputs.summary_json }}
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}