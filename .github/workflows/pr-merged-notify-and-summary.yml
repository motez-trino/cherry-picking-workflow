name: PR Merged Notify and Daily Summary

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-merged-notify:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.PR_MERGED_WEBHOOK_URL }}
    steps:
      - name: Prepare PR body
        id: prepare_body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const trunc = body.length > 800 ? body.slice(0, 800) + '…' : body;
            const wrapped = '```\n' + trunc.replace(/```/g, '``\`') + '\n```';
            core.setOutput('body_sanitized', wrapped);
      - name: Notify Slack on PR merged
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🎉 PR merged successfully
            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})
            Merged Into: ${{ github.event.pull_request.base.ref }}
            Merged By: ${{ github.event.pull_request.merged_by.login }}

            ${{ steps.prepare_body.outputs.body_sanitized }}

  daily-summary:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.PR_MERGED_WEBHOOK_URL }}
    steps:
      - name: Build merged PR summary for last 24h
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sinceISO = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const q = `repo:${owner}/${repo} is:pr is:merged merged:>=${sinceISO}`;
            const res = await github.rest.search.issuesAndPullRequests({ q, sort: 'updated', order: 'desc', per_page: 50 });
            const items = res.data.items || [];
            if (items.length === 0) {
              core.setOutput('summary_text', 'No PRs merged in the last 24 hours.');
              return;
            }
            const lines = [];
            for (const it of items) {
              const num = it.number;
              const pull = await github.rest.pulls.get({ owner, repo, pull_number: num });
              const base = pull.data.base.ref;
              const title = it.title;
              const url = it.html_url;
              const mergedBy = pull.data.merged_by ? pull.data.merged_by.login : 'unknown';
              const mergedAt = pull.data.merged_at || it.closed_at || '';
              lines.push(`• #${num} ${title} → ${base} (by ${mergedBy})\n   ${url}\n   merged at ${mergedAt}`);
            }
            const header = `Merged PRs in the last 24 hours for ${owner}/${repo}`;
            const text = `${header}\n\n${lines.join('\n')}`;
            core.setOutput('summary_text', text);

      - name: Notify Slack daily merged PR summary
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ${{ steps.build.outputs.summary_text }}
