name: Auto Cherry-Pick Hotfix to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read
  workflows: write

jobs:
  cherry-pick:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Cherry-pick merge commit into develop
        id: cherry_pick
        run: |
          merge_sha="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$merge_sha" ]; then
            echo "::error::Missing merge commit SHA"; exit 1
          fi
          git checkout develop || { echo "::error::Failed to checkout develop"; exit 1; }
          if ! git cherry-pick -m 1 "$merge_sha"; then
            echo "conflict=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "conflict=false" >> $GITHUB_OUTPUT

      - name: Push changes to develop
        if: ${{ steps.cherry_pick.outputs.conflict == 'false' }}
        run: git push origin develop

      - name: Notify Slack on success
        if: ${{ success() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "✅ Hotfix cherry-picked",
              "blocks": [
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "✅ *Cherry-pick completed.*\nRepo: *${{ github.repository }}*\nFrom: `main`\nTo: `develop`\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nMerge: <https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}|${{ github.event.pull_request.merge_commit_sha }}>\nMerged By: *${{ github.event.pull_request.merged_by.login }}*" }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":x: Cherry-pick failed",
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": ":x: *Cherry-pick failed.*\nRepo: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>" } }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}