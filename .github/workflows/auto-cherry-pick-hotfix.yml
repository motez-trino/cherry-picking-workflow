name: Auto Cherry-Pick Hotfix to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cherry-pick:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for cherry-pick

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop branch
        run: |
          git fetch origin develop || :

      - name: Build commit list to cherry-pick
        id: build_list
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          HEAD_REF=${{ github.event.pull_request.head.ref }}

          echo "Pull Request base: $BASE_SHA"
          echo "Pull Request head: $HEAD_SHA ($HEAD_REF)"

          # Ensure head branch is available locally
          git fetch origin "$HEAD_REF" || :

          # List commits in PR (exclude merges), oldest-first
          COMMITS=$(git log --no-merges --reverse --format=%H "$BASE_SHA".."$HEAD_SHA")

          if [ -z "$COMMITS" ]; then
            echo "No commits found in PR range; nothing to cherry-pick."
            echo "to_pick=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotency: filter out commits already in develop
          TO_PICK=""
          for c in $COMMITS; do
            if git merge-base --is-ancestor "$c" origin/develop; then
              echo "Commit $c already in develop; skipping."
            else
              TO_PICK="$TO_PICK $c"
            fi
          done

          TO_PICK=$(echo "$TO_PICK" | xargs)
          echo "Commits to cherry-pick: $TO_PICK"
          echo "to_pick=$TO_PICK" >> "$GITHUB_OUTPUT"

      - name: Stop if nothing to cherry-pick
        if: ${{ steps.build_list.outputs.to_pick == '' }}
        run: echo "No new commits to cherry-pick; exiting."

      

      - name: Cherry-pick PR commits into develop
        id: cherry_pick
        shell: bash
        run: |
          set -euo pipefail
          # Checkout develop and verify
          git checkout develop || { echo "Failed to checkout develop"; exit 1; }

          CONFLICT=false
          for c in ${{ steps.build_list.outputs.to_pick }}; do
            echo "Cherry-picking commit $c into develop..."
            if ! git cherry-pick -x "$c"; then
              echo "::error::Cherry-pick conflict detected for commit $c. Aborting."
              git cherry-pick --abort || :
              CONFLICT=true
              break
            fi
          done

          echo "conflict=${CONFLICT}" >> "$GITHUB_OUTPUT"

      - name: Push changes to develop
        if: steps.cherry_pick.outputs.conflict == 'false'
        run: |
          git push origin develop
          echo "✅ Successfully cherry-picked hotfix into develop!"

      - name: Notify Slack on success (webhook)
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          PR_URL=${{ github.event.pull_request.html_url }}
          ACTOR=${{ github.event.pull_request.merged_by.login }}
          TEXT="✅ Cherry-pick completed successfully.\nRepository: ${{ github.repository }}\nFrom: main\nTo: develop\nPR: <${PR_URL}|view PR>\nMerged by: ${ACTOR}"
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text, blocks: [{type:"section", text:{type:"mrkdwn", text:$text}}]}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on conflict (webhook)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' && steps.cherry_pick.outputs.conflict == 'true' }}
        shell: bash
        run: |
          PR_URL=${{ github.event.pull_request.html_url }}
          ACTOR=${{ github.event.pull_request.merged_by.login }}
          TEXT=":warning: Cherry-pick failed while merging a hotfix into develop.\nRepository: ${{ github.repository }}\nPR: <${PR_URL}|view PR>\nMerged by: ${ACTOR}\n\nManual intervention is required."
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text, blocks: [{type:"section", text:{type:"mrkdwn", text:$text}}]}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"