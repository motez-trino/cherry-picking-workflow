name: Auto Cherry-Pick Hotfix to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cherry-pick:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: List PR commits
        id: list_commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const num = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: num, per_page: 100 });
            const shas = commits.map(c => c.sha);
            core.setOutput('shas', shas.join('\n'));

      - name: Cherry-pick commits into develop
        id: cherry_pick
        run: |
          git checkout develop || { echo "Failed to checkout develop"; exit 1; }
          conflict=false
          applied=false
          while IFS= read -r sha; do
            if git merge-base --is-ancestor "$sha" develop; then
              continue
            fi
            files=$(git show --pretty='' --name-only "$sha")
            non_ci=$(echo "$files" | grep -Ev '^\.github(/|$)') || true
            if [ -z "$non_ci" ]; then
              continue
            fi
            if ! git cherry-pick -X theirs -n "$sha"; then
              git cherry-pick --abort
              echo "conflict=true" >> $GITHUB_OUTPUT
              exit 1
            fi
            if echo "$files" | grep -E '^\.github(/|$)'; then
              git restore --staged --worktree --source=HEAD .github || true
            fi
            applied=true
          done <<< "${{ steps.list_commits.outputs.shas }}"
          if [ "$applied" = true ] && ! git diff --cached --quiet; then
            git commit -m "Cherry-pick hotfix PR #${{ github.event.pull_request.number }} into develop (CI files excluded; prefer theirs on conflicts)"
            echo "already_applied=false" >> $GITHUB_OUTPUT
          else
            echo "already_applied=true" >> $GITHUB_OUTPUT
          fi
          echo "conflict=false" >> $GITHUB_OUTPUT

      - name: Push changes to develop
        if: ${{ steps.cherry_pick.outputs.conflict == 'false' && steps.cherry_pick.outputs.already_applied == 'false' }}
        run: git push origin develop

      - name: Notify Slack (bot) on success
        if: ${{ success() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' && steps.cherry_pick.outputs.already_applied == 'false' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "✅ Hotfix cherry-picked to develop",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Cherry-pick completed successfully.*\nRepository: *${{ github.repository }}*\nFrom: `main`\nTo: `develop`\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nMerged By: *${{ github.event.pull_request.merged_by.login }}*"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (bot) already applied
        if: ${{ success() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' && steps.cherry_pick.outputs.already_applied == 'true' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "ℹ️ Hotfix already present in develop",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ℹ️ Commits from hotfix PR #${{ github.event.pull_request.number }} are already present in `develop`."
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (bot) on conflict
        if: ${{ steps.cherry_pick.outcome == 'failure' && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' && steps.cherry_pick.outputs.conflict == 'true' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":warning: Cherry-pick conflict detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Cherry-pick failed while merging a hotfix into `develop`.*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nMerged By: *${{ github.event.pull_request.merged_by.login }}*\n\nManual intervention is required."
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (bot) on other failure
        if: ${{ failure() && (steps.cherry_pick.outputs.conflict != 'true') && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":x: Cherry-pick workflow failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Cherry-pick workflow encountered an error unrelated to merge conflicts.*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}