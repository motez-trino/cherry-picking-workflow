name: PR Merged Notify

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-merged-notify:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Prepare PR body
        id: prepare_body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const trunc = body.length > 800 ? body.slice(0, 800) + '…' : body;
            const wrapped = '```\n' + trunc.replace(/```/g, '``\`') + '\n```';
            core.setOutput('body_sanitized', wrapped);
      - name: Notify Slack on PR merged
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🎉 PR merged successfully
            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})
            Merged Into: ${{ github.event.pull_request.base.ref }}
            Merged By: ${{ github.event.pull_request.merged_by.login }}

            ${{ steps.prepare_body.outputs.body_sanitized }}
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}