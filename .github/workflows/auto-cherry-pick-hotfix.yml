name: Auto Cherry-Pick Hotfix to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cherry-pick:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Prepare cherry-pick range
        id: prepare
        run: |
          echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "merge_commit=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_OUTPUT

      - name: Cherry-pick hotfix range into develop
        id: cherry_pick
        if: ${{ steps.prepare.outputs.base_sha != '' && steps.prepare.outputs.head_sha != '' }}
        run: |
          base=${{ steps.prepare.outputs.base_sha }}
          head=${{ steps.prepare.outputs.head_sha }}
          pr=${{ steps.prepare.outputs.pr_number }}
          git checkout develop || { echo "::error::Failed to checkout develop"; exit 1; }
          if ! git cherry-pick -n ${base}..${head}; then
            echo "conflict=true" >> $GITHUB_OUTPUT
            git cherry-pick --abort
            exit 1
          fi
          if git diff --quiet; then
            echo "already_applied=true" >> $GITHUB_OUTPUT
            git reset --hard
          else
            echo "already_applied=false" >> $GITHUB_OUTPUT
            git commit -m "Cherry-pick hotfix PR #${pr} into develop"
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes to develop
        if: ${{ steps.cherry_pick.outputs.conflict == 'false' && steps.cherry_pick.outputs.already_applied == 'false' }}
        run: git push origin develop

      - name: Notify Slack (bot) on success
        if: ${{ success() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' && steps.cherry_pick.outputs.already_applied == 'false' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "✅ Hotfix cherry-picked to develop",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Cherry-pick completed successfully.*\nRepository: *${{ github.repository }}*\nFrom: `main`\nTo: `develop`\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nMerge: <https://github.com/${{ github.repository }}/commit/${{ steps.prepare.outputs.merge_commit }}|${{ steps.prepare.outputs.merge_commit }}>\nMerged By: *${{ github.event.pull_request.merged_by.login }}*"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (bot) already applied
        if: ${{ success() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' && steps.cherry_pick.outputs.already_applied == 'true' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "ℹ️ Hotfix already present in develop",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ℹ️ Commits from hotfix PR #${{ github.event.pull_request.number }} are already present in `develop`."
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (bot) on conflict
        if: ${{ steps.cherry_pick.outcome == 'failure' && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' && steps.cherry_pick.outputs.conflict == 'true' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":warning: Cherry-pick conflict detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Cherry-pick failed while merging a hotfix into `develop`.*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nMerged By: *${{ github.event.pull_request.merged_by.login }}*\n\nManual intervention is required."
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (bot) on other failure
        if: ${{ failure() && (steps.cherry_pick.outputs.conflict != 'true') && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":x: Cherry-pick workflow failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Cherry-pick workflow encountered an error unrelated to merge conflicts.*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}