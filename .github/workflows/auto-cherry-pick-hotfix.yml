name: Auto Cherry-Pick Hotfix to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: List PR commits
        id: list_commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const num = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: num, per_page: 100 });
            const shas = commits.map(c => c.sha);
            core.setOutput('shas', shas.join('\n'));

      - name: Cherry-pick commits into develop
        id: cherry_pick
        run: |
          git checkout develop || { echo "Failed to checkout develop"; exit 1; }
          conflict=false
          while IFS= read -r sha; do
            if git merge-base --is-ancestor "$sha" develop; then
              continue
            fi
            if ! git cherry-pick "$sha"; then
              git cherry-pick --abort
              echo "conflict=true" >> $GITHUB_OUTPUT
              exit 1
            fi
          done <<< "${{ steps.list_commits.outputs.shas }}"
          echo "conflict=false" >> $GITHUB_OUTPUT

      - name: Push changes to develop
        if: steps.cherry_pick.outputs.conflict == 'false'
        run: git push origin develop

      - name: Notify Slack (webhook) on success
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "✅ Hotfix cherry-picked to develop",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "✅ *Cherry-pick completed successfully.*\nRepository: *${{ github.repository }}*\nFrom: `main`\nTo: `develop`\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nActor: *${{ github.event.pull_request.merged_by.login }}*"}}
            ]
          }' $SLACK_WEBHOOK_URL

      - name: Notify Slack (bot) on success
        if: ${{ success() && env.SLACK_WEBHOOK_URL == '' && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "✅ Hotfix cherry-picked to develop",
              "blocks": [
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "✅ *Cherry-pick completed successfully.*\nRepository: *${{ github.repository }}*\nFrom: `main`\nTo: `develop`\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nActor: *${{ github.event.pull_request.merged_by.login }}*"}
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

      - name: Notify Slack (webhook) on conflict
        if: ${{ steps.cherry_pick.outcome == 'failure' && steps.cherry_pick.outputs.conflict == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": ":warning: Cherry-pick conflict detected",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": ":warning: *Cherry-pick failed while merging a hotfix into `develop`.*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nActor: *${{ github.event.pull_request.merged_by.login }}*\n\nManual intervention is required."}}
            ]
          }' $SLACK_WEBHOOK_URL

      - name: Notify Slack (bot) on conflict
        if: ${{ steps.cherry_pick.outcome == 'failure' && steps.cherry_pick.outputs.conflict == 'true' && env.SLACK_WEBHOOK_URL == '' && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":warning: Cherry-pick conflict detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": ":warning: *Cherry-pick failed while merging a hotfix into `develop`.*\nRepository: *${{ github.repository }}*\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\nActor: *${{ github.event.pull_request.merged_by.login }}*\n\nManual intervention is required."}
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}